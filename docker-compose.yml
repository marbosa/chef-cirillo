services:
  client:
    build: ./client
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - node_modules_client:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:       
      - server

  server:
    build: ./server
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - node_modules_server:/app/node_modules
    depends_on:
      - database

  database:
    image: postgres:16
    environment:      
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5433"
    volumes:           
      - pgdata:/var/lib/postgresql/data

volumes:
  node_modules_client:
  node_modules_server:
  pgdata: